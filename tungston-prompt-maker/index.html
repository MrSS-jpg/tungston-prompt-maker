<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROMPT MAKER — TUNGSTON</title>
<meta name="description" content="Turn a rough idea into a sharp, structured prompt worth running.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--concrete:#b9b9b4;--paper:#dcdcd6;--ink:#0a0a0a;--amber:#ffb000;--gun:#26272a}
*{box-sizing:border-box;margin:0;padding:0;border-radius:0}
body{background:var(--concrete);color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:15px;line-height:1.55;min-height:100vh}
a{color:inherit}
.bar{display:flex;align-items:stretch;justify-content:space-between;border-bottom:4px solid var(--ink);background:var(--paper)}
.brand{display:flex;align-items:center;gap:14px;padding:10px 18px;text-decoration:none}
.el{border:3px solid var(--ink);background:var(--amber);padding:2px 8px;line-height:1.1;text-align:center}
.el b{display:block;font-family:'Archivo Black',sans-serif;font-size:22px}
.el i{display:block;font-style:normal;font-size:11px;font-weight:700}
.brand span{font-family:'Archivo Black',sans-serif;font-size:22px;letter-spacing:1px}
.back{display:flex;align-items:center;padding:0 20px;border-left:4px solid var(--ink);font-weight:700;text-decoration:none;background:var(--ink);color:var(--amber)}
.back:hover{background:var(--amber);color:var(--ink)}
main{max-width:980px;margin:0 auto;padding:40px 18px 60px}
.tag{display:inline-block;background:var(--ink);color:var(--amber);padding:3px 10px;font-weight:700;font-size:13px;letter-spacing:1px;margin-bottom:14px}
h1{font-family:'Archivo Black',sans-serif;font-size:clamp(40px,9vw,84px);line-height:.95;text-transform:uppercase;margin-bottom:16px}
.lead{max-width:620px;margin-bottom:34px;font-weight:500}
.panel{background:var(--paper);border:4px solid var(--ink);box-shadow:10px 10px 0 var(--ink);margin-bottom:34px}
.ph{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:var(--paper);padding:8px 16px;font-weight:700;font-size:13px;letter-spacing:1px}
.ph em{font-style:normal;color:var(--amber)}
.pb{padding:20px}
label{display:block;font-weight:700;font-size:13px;letter-spacing:1px;margin-bottom:8px}
textarea{width:100%;min-height:180px;resize:vertical;background:#fff;border:4px solid var(--ink);padding:14px;font-family:inherit;font-size:15px;color:var(--ink);outline:none}
textarea:focus{box-shadow:6px 6px 0 var(--amber)}
.row{display:flex;flex-wrap:wrap;gap:20px;margin-top:20px;align-items:flex-end}
.seg{display:flex;border:4px solid var(--ink);background:#fff}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{margin:0;padding:10px 18px;cursor:pointer;border-right:4px solid var(--ink);letter-spacing:0}
.seg label:last-of-type{border-right:0}
.seg input:checked+label{background:var(--amber)}
.seg input:focus-visible+label{outline:3px solid var(--ink);outline-offset:-6px}
.count{margin-left:auto;font-size:13px;font-weight:700}
button{font-family:'Archivo Black',sans-serif;font-size:18px;text-transform:uppercase;letter-spacing:1px;background:var(--ink);color:var(--amber);border:4px solid var(--ink);padding:14px 26px;cursor:pointer;box-shadow:6px 6px 0 var(--amber)}
button:hover:not(:disabled){background:var(--amber);color:var(--ink);box-shadow:6px 6px 0 var(--ink)}
button:active:not(:disabled){transform:translate(6px,6px);box-shadow:0 0 0 var(--ink)}
button:disabled{background:var(--gun);color:#888;box-shadow:6px 6px 0 #777;cursor:not-allowed}
.go{margin-top:24px}
.err{display:none;margin-top:20px;border:4px solid var(--ink);background:#ff4d2e;padding:12px 16px;font-weight:700}
.err.on{display:block}
#out{display:none}
#out.on{display:block}
pre{white-space:pre-wrap;word-wrap:break-word;background:var(--gun);color:#f2f2ee;padding:20px;font-family:inherit;font-size:14px;border:4px solid var(--ink);min-height:120px}
.copy{margin-top:20px;font-size:15px;padding:10px 20px;background:var(--amber);color:var(--ink);box-shadow:5px 5px 0 var(--ink)}
.copy:hover:not(:disabled){background:var(--ink);color:var(--amber);box-shadow:5px 5px 0 var(--amber)}
footer{border-top:4px solid var(--ink);background:var(--ink);color:var(--paper);padding:16px 18px;text-align:center;font-weight:700;font-size:13px;letter-spacing:1px}
@media(max-width:560px){.count{margin-left:0;width:100%}.seg label{padding:10px 12px}.panel{box-shadow:6px 6px 0 var(--ink)}}
</style>
</head>
<body>
<header class="bar">
  <a class="brand" href="https://tungston-hazel.vercel.app/">
    <div class="el"><i>74</i><b>W</b></div>
    <span>TUNGSTON</span>
  </a>
  <a class="back" href="https://tungston-hazel.vercel.app/">← ALL TOOLS</a>
</header>
<main>
  <div class="tag">PM-04</div>
  <h1>Prompt Maker</h1>
  <p class="lead">Drop in a rough idea. Get back a structured prompt with role, task, context, requirements, and output format — ready to paste into any AI.</p>

  <section class="panel">
    <div class="ph"><span>INPUT</span><em>ROUGH IDEA</em></div>
    <div class="pb">
      <label for="idea">WHAT DO YOU WANT THE AI TO DO?</label>
      <textarea id="idea" maxlength="4000" placeholder="e.g. help me write cold emails to small bakery owners offering a website redesign"></textarea>
      <div class="row">
        <div>
          <label>PROMPT FOR</label>
          <div class="seg" role="radiogroup" aria-label="Prompt target">
            <input type="radio" name="target" id="t-text" value="text" checked><label for="t-text">TEXT</label>
            <input type="radio" name="target" id="t-code" value="code"><label for="t-code">CODE</label>
            <input type="radio" name="target" id="t-image" value="image"><label for="t-image">IMAGE</label>
          </div>
        </div>
        <div class="count"><span id="count">0</span> / 4000</div>
      </div>
      <button class="go" id="go" type="button">Forge Prompt</button>
      <div class="err" id="err" role="alert"></div>
    </div>
  </section>

  <section class="panel" id="out">
    <div class="ph"><span>OUTPUT</span><em>FINISHED PROMPT</em></div>
    <div class="pb">
      <pre id="result"></pre>
      <button class="copy" id="copy" type="button">Copy Prompt</button>
    </div>
  </section>
</main>
<footer>TUNGSTON — built raw, shipped straight.</footer>
<script>
var idea=document.getElementById('idea');
var go=document.getElementById('go');
var err=document.getElementById('err');
var out=document.getElementById('out');
var result=document.getElementById('result');
var copy=document.getElementById('copy');
var count=document.getElementById('count');

idea.addEventListener('input',function(){count.textContent=idea.value.length});

function showError(msg){err.textContent=msg;err.classList.add('on')}

go.addEventListener('click',async function(){
  err.classList.remove('on');
  var text=idea.value.trim();
  if(text.length<5){showError('Describe your idea in at least a few words.');return}
  var target=document.querySelector('input[name="target"]:checked').value;
  go.disabled=true;
  go.textContent='Forging...';
  try{
    var r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idea:text,target:target})});
    var d=await r.json();
    if(!r.ok){showError(d.error||'Something failed. Try again.');return}
    result.textContent=d.prompt;
    out.classList.add('on');
    copy.textContent='Copy Prompt';
    out.scrollIntoView({behavior:'smooth',block:'start'});
  }catch(e){
    showError('Network error. Check your connection and try again.');
  }finally{
    go.disabled=false;
    go.textContent='Forge Prompt';
  }
});

copy.addEventListener('click',async function(){
  try{
    await navigator.clipboard.writeText(result.textContent);
    copy.textContent='Copied';
  }catch(e){
    var range=document.createRange();
    range.selectNodeContents(result);
    var sel=window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    copy.textContent='Selected — press Ctrl+C';
  }
});
</script>
</body>
</html>
